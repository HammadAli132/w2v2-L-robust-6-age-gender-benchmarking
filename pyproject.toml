[project]
name = "age-gender-bench"
version = "0.1.0"
description = "Single-instance speech inference experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.3",
    "nvidia-ml-py>=13.610.43",
    "onnx>=1.23.0",
    "onnxruntime>=1.30.0",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "tensorrt-cu13>=10.13,<11",
    "torch==2.15.0.dev20260925+cu130",
    "transformers>=4.48,<5",
    "triton>=3.8.0",
]

[tool.uv]
package = false
prerelease = "allow"
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-nightly" }
triton = { index = "pytorch-nightly" }
